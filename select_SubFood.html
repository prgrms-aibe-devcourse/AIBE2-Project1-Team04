<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휙떠나 - 음식 고르기</title>

    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f8; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .random-pick { background: linear-gradient(90deg, #f857a6, #ff5858); color: white; padding: 20px; border-radius: 15px;
          margin-bottom: 20px; cursor: pointer; font-weight: bold; }
        .random-pick:hover { opacity: 0.9; }
        .options { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .option { width: 100px; height: 100px; margin: 10px; background: #fafafa; border: 1px solid #ddd; border-radius: 10px;
          display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .option.selected { background: #5a4fd7; color: white; font-weight: bold; }
        .button-group { margin-top: 20px; }
        .button-group button { padding: 10px 30px; background: #a08ef4; color: white; border: none; border-radius: 10px; cursor: pointer; }
      </style>
      
</head>
<body>
    <!-- 진행 바 -->
    <div class="progress-bar">
    </div>

    <div class="card">
      <h2>먹고 싶은 음식을 선택하세요</h2>
      <div class="random-pick" onclick="randomPick()">
        🎲 랜덤으로 선택하기
      </div>
      <div class="options">
        <div class="option" onclick="toggleSelect(this, '비빔밥')">비빔밥</div>
        <div class="option" onclick="toggleSelect(this, '불고기')">불고기</div>
        <div class="option" onclick="toggleSelect(this, '김치찌개')">김치찌개</div>
        <div class="option" onclick="toggleSelect(this, '된장찌개')">된장찌개</div>
        <div class="option" onclick="toggleSelect(this, '삼겹살')">삼겹살</div>
        <div class="option" onclick="toggleSelect(this, '냉면')">냉면</div>
      </div>

      <div id="selected-info" class="selected-info">
        <p id="days-text">여행 일수: 3일</p>
        <p>선택한 음식 종류 : <span id="category-text">-</span></p>
        <p>선택한 음식 : <span id="food-text">선택해주세요</span></p>
      </div>

      <div class="button-group">
        <button onclick="goNext()">다음</button>
      </div>
    </div>

    <script>
        let selectedFoods = [];

        // 페이지 로드될 때 카테고리 표시
        window.onload = function() {
            const selectFoodCategory = JSON.parse(localStorage.getItem('selectFoodCategory'));

            if (selectFoodCategory) {
            document.getElementById('category-text').innerText = `${selectFoodCategory}`;
            } else {
            document.getElementById('category-text').innerText = '선택되지 않음';
            }
        };

        function toggleSelect(element, foodName) {
          if (selectedFoods.includes(foodName)) {
            selectedFoods = selectedFoods.filter(f => f !== foodName);
            element.classList.remove('selected');
          } else {
            selectedFoods.push(foodName);
            element.classList.add('selected');
          }

          // 선택한 음식 텍스트 업데이트
          const foodText = document.getElementById('food-text');
          if(selectedFoods.length > 0){
            foodText.textContent = `${selectedFoods}`;
          } else {
            foodText.textContent = `선택해주세요.`;
          }
        }
      
        function randomPick(){
          // 모든 선택 해제
          const selectedOptions = document.querySelectorAll('.option.selected');
          selectedOptions.forEach(option => {
            option.classList.remove('selected');
          });

          // 선택된 음식 배열 비우기
          selectedFoods = [];

          // 하단 텍스트 '랜덤'으로 표시
          document.getElementById('food-text').innerText = '랜덤';      
        }
        
        function goNext() {
          if (selectedFoods.length === 0) {
            alert('하나 이상 선택해주세요!');
            return;
          }
          localStorage.setItem('selectedFoods', JSON.stringify(selectedFoods));
        location.href = 'select_SubFood.html';
      }

    </script>

</body>
</html>
