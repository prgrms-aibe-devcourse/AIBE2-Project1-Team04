<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="config/apiKey.js"></script>
  <title>휙떠나 - 음식 고르기</title>
  <link rel="stylesheet" href="style/style.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #e0e7ff, #f9fafb);
      color: #333;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      margin: 40px auto;
      max-width: 960px; /* ✅ 넓이 증가 */
      width: 90%; /* 모바일 대응 */
      position: relative;
    }

    .random-pick {
      background: linear-gradient(90deg, #f857a6, #ff5858);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .random-pick:hover {
      opacity: 0.9;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .option {
      flex-grow: 1;
      flex-basis: 160px; /* 기본 너비 */
      max-width: 240px; /* 최대 너비 제한 */
      padding: 12px 16px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      font-size: 15px;
      word-break: break-word; /* ✅ 텍스트 줄바꿈 허용 */
      white-space: normal;
      min-height: 60px;
    }

    .option.selected {
      background: #5a4fd7;
      color: white;
      font-weight: bold;
    }

    .button-group {
      margin-top: 20px;
    }

    .button-group button {
      padding: 10px 30px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .selected-info {
      background: #eef3ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- 헤더 -->
<header style="background:#fff; padding:16px 32px; display:flex; justify-content:space-between; align-items:center;">
  <h1 style="font-size:1.8rem; font-weight:bold; margin:0; display:flex; align-items:center;">
    <span style="background:linear-gradient(90deg, #4e54c8, #ec407a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">휙떠나</span>
    <small style="font-size:0.75rem; background:#d1e8ff; color:#2196f3; padding:2px 6px; border-radius:4px; margin-left:8px;">베타</small>
  </h1>
  <a id="btnHome" href="#" style="text-decoration:none; color:#333; font-weight:bold;">메인으로</a>
</header>

<div style="height:4px; background:#e0e0e0;">
  <div style="width:75%; height:100%; background:#2196f3; transition:width 0.3s;"></div>
</div>

<div class="card">
  <button id="btnPrev" style="position:absolute; left:30px; top:30px; background:none; border:none; color:#2196f3; font-size:1rem; cursor:pointer;">← 이전</button>
  <h2>먹고 싶은 음식을 선택하세요</h2>
  <div class="random-pick" onclick="randomPick()">🎲 랜덤으로 선택하기</div>
  <div class="options" id="options-container"></div>
  <div id="selected-info" class="selected-info">
    <p>여행 일수: <span id="days-text">-</span></p>
    <p>선택한 음식 종류: <span id="category-text">-</span></p>
    <p>선택한 음식: <span id="food-text">선택해주세요</span></p>
  </div>
  <div class="button-group">
    <button onclick="goNext()">다음</button>
  </div>
</div>

<script>
  async function translateToKorean(text) {
    const apiKey = 'BoqCh6MuX20F80yvwfMJxsPlceU3W0ky8MCb7fr2Oo3uiVrjx6XjJQQJ99BEACNns7RXJ3w3AAAbACOG4IXz';
    const endpoint = 'https://api.cognitive.microsofttranslator.com/';
    const region = 'koreacentral';
    const url = `${endpoint}translate?api-version=3.0&to=ko`;

    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Ocp-Apim-Subscription-Key': apiKey,
        'Ocp-Apim-Subscription-Region': region,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify([{ Text: text }])
    });

    const result = await response.json();
    if (response.ok && result[0]?.translations?.[0]?.text) {
      return result[0].translations[0].text;
    } else {
      console.error("번역 실패:", result);
      throw new Error("번역 요청 실패");
    }
  }

  let selectedFoods = [];
  const apiKey = SPOON_API_KEY;
  let selectFoodCategory;
  let foodMap = {};

  window.onload = function() {
    document.getElementById('btnPrev').onclick = () => history.back();
    document.getElementById('btnHome').onclick = e => {
      e.preventDefault();
      window.location.href = 'main-home.html';
    };

    selectFoodCategory = JSON.parse(localStorage.getItem('selectFoodCategory'));
    const days = localStorage.getItem('selectedDays');
    document.getElementById('days-text').innerText = `${days}일`;

    if (selectFoodCategory) {
      document.getElementById('category-text').innerText = selectFoodCategory;
      fetchFoods(selectFoodCategory);
    } else {
      document.getElementById('category-text').innerText = '선택되지 않음';
    }
  };

  async function fetchFoods(category) {
    const categoryMap = {
      "한식": "korean",
      "일식": "japanese",
      "중식": "chinese",
      "양식": "European,Italian,French,American",
      "아시안": "Asian,Thai,Vietnamese",
      "멕시칸": "Mexican"
    };

    const cuisineParam = categoryMap[category];
    const url = `https://api.spoonacular.com/recipes/complexSearch?cuisine=${encodeURIComponent(cuisineParam)}&number=6&apiKey=${apiKey}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      const foods = data.results;

      if (!Array.isArray(foods) || foods.length === 0) {
        alert("검색된 음식이 없습니다. 다른 카테고리를 선택해보세요.");
        return;
      }

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      for (const food of foods) {
        const original = food.title;
        const translated = await translateToKorean(original);
        foodMap[translated] = original;

        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = translated;
        div.onclick = () => toggleSelect(div, translated);
        container.appendChild(div);
      }
    } catch (error) {
      alert('음식 정보를 불러오지 못했습니다.');
      console.error('오류:', error);
    }
  }

  function toggleSelect(el, foodName) {
    if (selectedFoods.includes(foodName)) {
      selectedFoods = selectedFoods.filter(f => f !== foodName);
      el.classList.remove('selected');
    } else {
      if (selectedFoods.length >= 2) {
        alert("최대 2개까지만 선택할 수 있습니다.");
        return;
      }
      selectedFoods.push(foodName);
      el.classList.add('selected');
    }
    const foodText = document.getElementById('food-text');
    if (selectedFoods.length > 0) {
      foodText.textContent = selectedFoods.join(', ');
      foodText.textContent = translated;
    } else {
      foodText.textContent = '선택해주세요.';
  }
}

  function randomPick() {
    document.querySelectorAll('.option.selected').forEach(o => o.classList.remove('selected'));
    const allOptions = Array.from(document.querySelectorAll('.option'));
    const randomOption = allOptions[Math.floor(Math.random() * allOptions.length)];
    selectedFoods = [randomOption.innerText];
    document.getElementById('food-text').innerText = '랜덤';
  }

  function goNext() {
    if (selectedFoods.length === 0) {
      alert('하나 이상 선택해주세요!');
      return;
    }
    localStorage.setItem('selectedFoods', JSON.stringify(selectedFoods));
    location.href = 'result.html';
  }
</script>

</body>
</html>
