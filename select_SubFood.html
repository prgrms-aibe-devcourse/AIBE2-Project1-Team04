<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휙떠나 - 음식 고르기</title>
  <link rel="stylesheet" href="style/style.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f2f8;
      padding: 20px;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: 40px;
    }

    .random-pick {
      background: linear-gradient(90deg, #f857a6, #ff5858);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .random-pick:hover {
      opacity: 0.9;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .option {
      width: 100px;
      height: 100px;
      margin: 10px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .option.selected {
      background: #5a4fd7;
      color: white;
      font-weight: bold;
    }

    .button-group {
      margin-top: 20px;
    }

    .button-group button {
      padding: 10px 30px;
      background: #a08ef4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .selected-info {
      background: #eef3ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }

    .selected-info p {
      margin: 0;
    }
  </style>
</head>
<body style="margin:0; background: linear-gradient(to bottom, #e0e7ff, #f9fafb); color: #333;">

  <!-- 헤더 -->
<header style="background:#fff; padding:16px 32px; display:flex; justify-content:space-between; align-items:center;">
  <h1 style="font-size:1.8rem; font-weight:bold; margin:0; display:flex; align-items:center;">
    <span style="background:linear-gradient(90deg, #4e54c8, #ec407a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">휙떠나</span>
    <small style="font-size:0.75rem; background:#d1e8ff; color:#2196f3; padding:2px 6px; border-radius:4px; margin-left:8px;">베타</small>
  </h1>
  <a id="btnHome" href="#" style="text-decoration:none; color:#333; font-weight:bold;">메인으로</a>
</header>

<div style="height:4px; background:#e0e0e0;">
  <div style="width:75%; height:100%; background:#2196f3; transition:width 0.3s;"></div>
</div>

<!-- 카드 -->
    <div class="card">
      <h2>먹고 싶은 음식을 선택하세요</h2>
      <div class="random-pick" onclick="randomPick()">
        🎲 랜덤으로 선택하기
      </div>
      <div class="options" id="options-container">
         <!-- <div class="option" onclick="toggleSelect(this, '비빔밥')">비빔밥</div>
        <div class="option" onclick="toggleSelect(this, '불고기')">불고기</div>
        <div class="option" onclick="toggleSelect(this, '김치찌개')">김치찌개</div>
        <div class="option" onclick="toggleSelect(this, '된장찌개')">된장찌개</div>
        <div class="option" onclick="toggleSelect(this, '삼겹살')">삼겹살</div>
        <div class="option" onclick="toggleSelect(this, '냉면')">냉면</div> -->

      <div id="selected-info" class="selected-info">
        <p id="days-text">여행 일수: 3일</p>
        <p>선택한 음식 종류 : <span id="category-text">-</span></p>
        <p>선택한 음식 : <span id="food-text">선택해주세요</span></p>
      </div>

      <div class="button-group">
        <button onclick="goNext()">다음</button>
      </div>
    </div>


    <!-- 스크립트 -->
    <script>
        let selectedFoods = [];
        const apiKey = SPOON_API_KEY;
        console.log("SPOON_API_KEY:", apiKey);
        let selectFoodCategory;

        // 페이지 로드될 때 카테고리 표시
        window.onload = function() {
            selectFoodCategory = JSON.parse(localStorage.getItem('selectFoodCategory'));

            if (selectFoodCategory) {
            document.getElementById('category-text').innerText = `${selectFoodCategory}`;
            fetchFoods(selectFoodCategory);
            } else {
            document.getElementById('category-text').innerText = '선택되지 않음';
            }
        };

        // 음식 불러오기 
        async function fetchFoods(selectFoodCategory){
          const categoryMap = {
            "한식": "korean",
            "일식": "japanese",
            "중식": "chinese",
            "양식": "western",
            "아시안": "asian"
          };

          const englishCategory = categoryMap[selectFoodCategory] || selectFoodCategory;
          
          const url = `https://api.spoonacular.com/recipes/complexSearch?query=${encodeURIComponent(englishCategory)}&number=6&apiKey=${apiKey}`;

          try{
            const res = await fetch(url);
            const data = await res.json();
            const foods = data.results;

            if (!Array.isArray(foods) || foods.length === 0) {
              console.warn("음식 결과가 없습니다. 응답:", data);
              alert("검색된 음식이 없습니다. 다른 카테고리를 선택해보세요.");
              return;
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // 기존 요소 비우기

            foods.forEach(food => {
              const div = document.createElement('div');
              div.className = 'option';
              div.textContent = food.title;
              div.onclick = () => toggleSelect(div, food.title);
              optionsContainer.appendChild(div);
            });
          } catch (error){
            console.error('음식 데이터를 불러오는 중 오류 발생 : ', error);
            alert('음식 정보를 불러오지 못했습니다.');
          }
        }

        function toggleSelect(element, foodName) {
          if (selectedFoods.includes(foodName)) {
            selectedFoods = selectedFoods.filter(f => f !== foodName);
            element.classList.remove('selected');
          } else {
            selectedFoods.push(foodName);
            element.classList.add('selected');
          }

          // 선택한 음식 텍스트 업데이트
          const foodText = document.getElementById('food-text');
          if(selectedFoods.length > 0){
            foodText.textContent = `${selectedFoods}`;
          } else {
            foodText.textContent = `선택해주세요.`;
          }
        }
      
        function randomPick(){
          // 모든 선택 해제
          const selectedOptions = document.querySelectorAll('.option.selected');
          selectedOptions.forEach(option => {
            option.classList.remove('selected');
          });

          // 선택된 음식 배열 비우기
          selectedFoods = [];

          // 하단 텍스트 '랜덤'으로 표시
          document.getElementById('food-text').innerText = '랜덤';      
        }
        
        function goNext() {
          if (selectedFoods.length === 0) {
            alert('하나 이상 선택해주세요!');
            return;
          }
          localStorage.setItem('selectedFoods', JSON.stringify(selectedFoods));
          window.location.href = 'result.html';
      }


  document.getElementById('btnHome').onclick = (e) => {
    e.preventDefault();
    window.location.href = 'main-home.html';
  };
</script>

</body>
</html>
