<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휙떠나 - 음식 고르기</title>

    <style>
      /* 스타일 공통 */
      body { font-family: 'Arial', sans-serif; background: #f0f2f8; padding: 20px; }
      .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
      .options { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
      .option { width: 100px; height: 100px; margin: 10px; background: #fafafa; border: 1px solid #ddd; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
      .option.selected { background: #5a4fd7; color: white; font-weight: bold; }
      .button-group { margin-top: 20px; }
      .button-group button { padding: 10px 30px; background: #a08ef4; color: white; border: none; border-radius: 10px; cursor: pointer; }
      .selected-info { background: #eef3ff; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 14px; color: #333;  }
      .selected-info p { margin: 0; }
    </style>
      
</head>
<body>
    <!-- 진행 바 -->
    <div class="progress-bar">
    </div>

    <div class="card" >
      <h2>먹고 싶은 음식 종류를 선택하세요</h2>
      <div class="options">
        <div class="option" onclick="toggleSelect(this, '한식')">한식</div>
        <div class="option" onclick="toggleSelect(this, '일식')">일식</div>
        <div class="option" onclick="toggleSelect(this, '중식')">중식</div>
        <div class="option" onclick="toggleSelect(this, '양식')">양식</div>
        <div class="option" onclick="toggleSelect(this, '아시안')">아시안</div>
        <div class="option" onclick="toggleSelect(this, '멕시칸')">멕시칸</div>
      </div>
      <div id="selected-info" class="selected-info">
        <p id="days-text">여행 일수: 3일</p>
        <p>선택한 음식 종류: <span id="category-text">선택해주세요</span></p>
      </div>
      <div class="button-group">
        <button onclick="goNext()">다음</button>
      </div>
    </div>

    <script>

      let selectFoodCategory = null;

      function toggleSelect(element, foodCategory){
        // 이미 선택된 값이 있다면 해체
        if (selectFoodCategory !== null){
          const prevSelected = document.querySelector('.option.selected');
          if (prevSelected) prevSelected.classList.remove('selected');
        }

        // 현재 선택한 것 적용
        if (selectFoodCategory === foodCategory){
          selectFoodCategory = null; // 다시 클릭하면 선택 해제
        } else {
          selectFoodCategory = foodCategory;
          element.classList.add('selected');
        }

        // 선택한 음식 종류 텍스트 업데이트
        const categoryText = document.getElementById('category-text');
        if(selectFoodCategory){
          categoryText.textContent = `${selectFoodCategory}`;
        } else{
          categoryText.textContent = `선택해주세요`;
        }
      }

      function goNext(){
        if (!selectFoodCategory){
          // 얼럿 없이 비활성화 예정
          alert('음식을 하나 선택해주세요!');
          return;
        }
        localStorage.setItem('selectFoodCategory', JSON.stringify(selectFoodCategory));
        console.log('현재 카테고리 값:', localStorage.getItem('selectFoodCategory'));
        const savedCategory = JSON.parse(localStorage.getItem('selectFoodCategory'));
        console.log('저장된 값 : '+savedCategory); // 정상적으로 저장된 값 확인 가능
        location.href = 'select_SubFood.html';
      }

    </script>

</body>
</html>
