<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>휙떠나 - 여행 일수 선택</title>
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f4f7fc; color:#333;">

<!-- 헤더 + 진행바 -->
<header style="display:flex; flex-direction:column; align-items:stretch; background:#fff; padding:16px 32px;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 style="font-size:1.8rem; font-weight:bold; margin:0; display:flex; align-items:center;">
      <span style="background:linear-gradient(90deg,#4e54c8,#ec407a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">휙떠나</span>
      <small style="font-size:0.75rem; background:#d1e8ff; color:#2196f3; padding:2px 6px; border-radius:4px; margin-left:8px;">베타</small>
    </h1>
    <a id="btnHome" href="#" style="text-decoration:none; color:#333; font-weight:bold;">메인으로</a>
  </div>

  <!-- 진행바 -->
  <div style="height:4px; background:#e0e0e0; margin-top:16px;">
    <div id="progress" style="width:25%; height:100%; background:#2196f3; transition:width .3s ease;"></div>
  </div>
</header>

<!-- 본문 -->
<div style="display:flex; justify-content:center; padding:0 16px; margin-top:24px;">
  <div style="background:#fff; border-radius:12px; padding:32px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:100%; max-width:500px; position:relative;">
    <button id="btnPrev" type="button" style="position:absolute; top:24px; left:24px; background:none; border:none; font-size:1rem; color:#2196f3; cursor:pointer;">← 이전</button>

    <h2 style="margin:0; text-align:center; font-size:1.25rem; color:#333;">여행 일수를 선택하세요</h2>

    <div id="displayBig" style="text-align:center; font-size:3rem; color:#2196f3; margin:16px 0 8px;">1일</div>

    <p style="text-align:center; font-size:0.9rem; color:#666; margin:0 0 24px;">원하는 여행 일수를 선택하세요</p>

    <div style="display:flex; justify-content:center; margin:0 0 24px;">
      <div style="background:#fff; border:1px solid #ccc; border-radius:8px; display:inline-flex; align-items:center; overflow:hidden;">
        <div id="btnDec" style="padding:8px 12px; cursor:pointer;">−</div>
        <div id="displayCounter" style="padding:8px 16px;">1일</div>
        <div id="btnInc" style="padding:8px 12px; cursor:pointer;">＋</div>
      </div>
    </div>

    <div style="background:#e3f2fd; border-radius:8px; padding:16px; margin-bottom:24px; font-size:0.9rem;">
      <div id="infoSelected" style="font-weight:bold; margin-bottom:8px;">선택한 일수: 1일</div>
      <div style="display:flex; align-items:center; color:#333;">
        <span style="display:inline-block; width:1rem; text-align:center; color:#2196f3; margin-right:8px;">ℹ</span>
        여행 일수에 따라 추천 일정이 달라집니다.
      </div>
    </div>

    <button id="btnNext" type="button" style="display:block; margin:0 auto; background:#2196f3; color:#fff; border:none; border-radius:8px; padding:12px 32px; font-size:1rem; cursor:pointer;">다음</button>
  </div>
</div>

<script>
(function(){
  let days = 1;
  const MIN = 1, MAX = 30;
  const elBig = document.getElementById('displayBig');
  const elCounter = document.getElementById('displayCounter');
  const elInfo = document.getElementById('infoSelected');
  const prog = document.getElementById('progress');
  let step = 1, total = 4;

  function render(){
    elBig.textContent = days + '일';
    elCounter.textContent = days + '일';
    elInfo.textContent = '선택한 일수: ' + days + '일';
  }

  document.getElementById('btnDec').onclick = ()=> { if(days>MIN){ days--; render(); } };
  document.getElementById('btnInc').onclick = ()=> { if(days<MAX){ days++; render(); } };
  document.getElementById('btnPrev').onclick = ()=> { history.back(); };

  document.getElementById('btnNext').onclick = ()=> {
    step = Math.min(step+1, total);
    prog.style.width = (step/total*100)+'%';

    // 선택한 일수 저장
    localStorage.setItem('selectedDays', days);

    // 추천 타입에 따라 페이지 이동
    const type = localStorage.getItem('recommendType');
    if (type === 'random') {
      window.location.href = 'result.html';  // ✅ 바로 result.html로 이동
    } else if (type === 'area') {
      window.location.href = 'region.html';
    } else if (type === 'food') {
      window.location.href = 'select_Mainfood.html';
    } else {
      alert('추천 방식을 선택해주세요.');
      window.location.href = 'main-home.html';
    }
  };

  document.getElementById('btnHome').onclick = (e) => {
    e.preventDefault();
    window.location.href = 'main-home.html';
  };

  render();
})();
</script>

</body>
</html>
