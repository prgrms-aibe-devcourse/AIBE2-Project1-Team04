
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>휙떠나 - 여행 일수 선택</title>
</head>
<body style="
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fc;
    color:#333;
">

  <!-- Header -->
  <header style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 32px;
      background:#fff;
      border-bottom:2px solid #2196f3;
  ">
    <h1 style="
        font-size:1.8rem;
        font-weight:bold;
        margin:0;
        display:flex;
        align-items:center;
    ">
      <span style="
          background:linear-gradient(90deg,#4e54c8,#ec407a);
          -webkit-background-clip:text;
          -webkit-text-fill-color:transparent;
          background-clip:text;
          color:transparent;
      ">휙떠나</span>
      <small style="
          font-size:0.75rem;
          background:#d1e8ff;
          color:#2196f3;
          padding:2px 6px;
          border-radius:4px;
          margin-left:8px;
      ">베타</small>
    </h1>
    <a href="#" style="
        text-decoration:none;
        color:#333;
        font-weight:bold;
    ">메인으로</a>
  </header>

  <!-- Progress Bar -->
  <div style="
      height:4px;
      background:#e0e0e0;
      margin:24px 0;
  ">
    <div id="progress" style="
        width:25%;
        height:100%;
        background:#2196f3;
        transition:width .3s ease;
    "></div>
  </div>

  <!-- 컨텐츠 카드 -->
  <div style="
      display:flex;
      justify-content:center;
      padding:0 16px;
  ">
    <div style="
        background:#fff;
        border-radius:12px;
        padding:32px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        width:100%;
        max-width:500px;
        position:relative;
    ">
      <!-- ← 이전 버튼 -->
      <button id="btnPrev" type="button" style="
          position:absolute;
          top:24px;
          left:24px;
          background:none;
          border:none;
          font-size:1rem;
          color:#2196f3;
          cursor:pointer;
      ">← 이전</button>

      <!-- 제목 -->
      <h2 style="
          margin:0;
          text-align:center;
          font-size:1.25rem;
          color:#333;
      ">여행 일수를 선택하세요</h2>

      <!-- 큰 숫자 -->
      <div id="displayBig" style="
          text-align:center;
          font-size:3rem;
          color:#2196f3;
          margin:16px 0 8px;
      ">1일</div>

      <!-- 서브텍스트 -->
      <p style="
          text-align:center;
          font-size:0.9rem;
          color:#666;
          margin:0 0 24px;
      ">원하는 여행 일수를 선택하세요</p>

      <!-- 카운터 컨트롤 박스 -->
      <div style="
          display:flex;
          justify-content:center;
          width:100%;
          margin:0 0 24px;
      ">
        <div style="
            background:#fff;
            border:1px solid #ccc;
            border-radius:8px;
            display:inline-flex;
            align-items:center;
            overflow:hidden;
        ">
          <div id="btnDec" style="
              padding:8px 12px;
              cursor:pointer;
              user-select:none;
          ">−</div>
          <div id="displayCounter" style="
              padding:8px 16px;
          ">1일</div>
          <div id="btnInc" style="
              padding:8px 12px;
              cursor:pointer;
              user-select:none;
          ">＋</div>
        </div>
      </div>

      <!-- 정보 박스 -->
      <div style="
          background:#e3f2fd;
          border-radius:8px;
          padding:16px;
          margin-bottom:24px;
          font-size:0.9rem;
      ">
        <div id="infoSelected" style="font-weight:bold; margin-bottom:8px;">
          선택한 일수: 1일
        </div>
        <div style="display:flex; align-items:center; color:#333;">
          <span style="
              display:inline-block;
              width:1rem;
              text-align:center;
              color:#2196f3;
              margin-right:8px;
          ">ℹ</span>
          여행 일수에 따라 추천 일정이 달라집니다.
        </div>
      </div>

      <!-- 다음 버튼 -->
      <button id="btnNext" type="button" style="
          display:block;
          margin:0 auto;
          background:#2196f3;
          color:#fff;
          border:none;
          border-radius:8px;
          padding:12px 32px;
          font-size:1rem;
          cursor:pointer;
      ">다음</button>
    </div>
  </div>

  <!-- 인라인 스크립트: 버튼 동작 처리 -->
  <script>
    (function(){
      let days = 1;
      const MIN = 1, MAX = 30;
      const elBig = document.getElementById('displayBig');
      const elCounter = document.getElementById('displayCounter');
      const elInfo = document.getElementById('infoSelected');
      const prog = document.getElementById('progress');
      let step = 1, total = 4;

      function render(){
        elBig.textContent = days + '일';
        elCounter.textContent = days + '일';
        elInfo.textContent = '선택한 일수: ' + days + '일';
      }
      document.getElementById('btnDec').onclick = ()=> { if(days>MIN){ days--; render(); } };
      document.getElementById('btnInc').onclick = ()=> { if(days<MAX){ days++; render(); } };
      document.getElementById('btnPrev').onclick = ()=> { history.back(); };
      document.getElementById('btnNext').onclick = ()=> {
        step = Math.min(step+1, total);
        prog.style.width = (step/total*100)+'%';
        console.log('선택 일수:', days);
      };
      render();
    })();
  </script>

</body>
</html>
