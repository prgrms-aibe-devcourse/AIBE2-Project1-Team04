<!-- ===== region.html ===== -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여행지 선택</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f4f7fc; color:#333;">

<!-- 헤더 -->
<header style="background:#fff; padding:16px 32px; display:flex; justify-content:space-between; align-items:center;">
  <h1 style="font-size:1.8rem; font-weight:bold; margin:0; display:flex; align-items:center;">
    <span style="background:linear-gradient(90deg, #4e54c8, #ec407a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">휙떠나</span>
    <small style="font-size:0.75rem; background:#d1e8ff; color:#2196f3; padding:2px 6px; border-radius:4px; margin-left:8px;">베타</small>
  </h1>
  <a id="btnHome" href="#" style="text-decoration:none; color:#333; font-weight:bold;">메인으로</a>
</header>

<div style="height:4px; background:#e0e0e0;">
  <div class="progress" style="width:50%; height:100%; background:#2196f3; transition:width 0.3s;"></div>
</div>

<main class="container">
  <form class="region-form">

    <!-- 네비게이션 -->
    <div class="form-nav">
      <a href="#" class="btn-back">← 이전</a>
      <span></span>
      <a href="#" class="btn-home">메인으로</a>
    </div>

    <h2 class="form-title">여행하고 싶은 지역을 선택하세요</h2>

    <!-- 지역 선택 -->
    <fieldset class="region-grid">
      <legend class="visually-hidden">여행 지역 선택</legend>

      <label><input type="radio" name="region" value="gapyeong-yangpyeong"><img src="icons/icon_00.png"><span>가평·양평</span></label>
      <label><input type="radio" name="region" value="gangneung-sokcho"><img src="icons/icon_01.png"><span>강릉·속초</span></label>
      <label><input type="radio" name="region" value="gyeongju"><img src="icons/icon_02.png"><span>경주</span></label>
      <label><input type="radio" name="region" value="busan"><img src="icons/icon_03.png"><span>부산</span></label>
      <label><input type="radio" name="region" value="yeosu"><img src="icons/icon_04.png"><span>여수</span></label>
      <label><input type="radio" name="region" value="incheon"><img src="icons/icon_05.png"><span>인천</span></label>
      <label><input type="radio" name="region" value="jeonju"><img src="icons/icon_06.png"><span>전주</span></label>
      <label><input type="radio" name="region" value="jeju"><img src="icons/icon_07.png"><span>제주</span></label>
      <label><input type="radio" name="region" value="chuncheon-hongcheon"><img src="icons/icon_08.png"><span>춘천·홍천</span></label>
      <label><input type="radio" name="region" value="taean"><img src="icons/icon_09.png"><span>태안</span></label>
      <label><input type="radio" name="region" value="tongyeong-geoje-namhae"><img src="icons/icon_10.png"><span>통영·거제·남해</span></label>
      <label><input type="radio" name="region" value="pohang-andong"><img src="icons/icon_11.png"><span>포항·안동</span></label>
    </fieldset>

    <!-- 선택 정보 -->
    <div class="selection-info">
      <p>여행 일수: <strong id="days-info">-</strong></p>
      <p>선택한 지역: <strong id="selected-region">선택해주세요</strong></p>
    </div>

    <!-- 제출 버튼 -->
    <button type="submit" class="btn-submit">추천 받기</button>
  </form>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const days = localStorage.getItem('selectedDays');
    if (days) {
      document.getElementById('days-info').textContent = `${days}일`;
    }
  });

  const selectedEl = document.getElementById('selected-region');
  document.querySelectorAll('input[name="region"]').forEach(radio => {
    radio.addEventListener('change', e => {
      const regionName = e.target.closest('label').querySelector('span').textContent;
      selectedEl.textContent = regionName;
    });
  });

  document.querySelector('.btn-back').addEventListener('click', e => {
    e.preventDefault();
    history.back();
  });

  document.getElementById('btnHome').addEventListener('click', e => {
    e.preventDefault();
    window.location.href = 'main-home.html';
  });

  document.querySelector('.region-form').addEventListener('submit', e => {
    e.preventDefault();
    const selectedRegion = document.querySelector('input[name="region"]:checked');
    if (!selectedRegion) {
      alert('지역을 선택해주세요!');
      return;
    }
    localStorage.setItem('selectedRegion', selectedRegion.value);
    window.location.href = 'result.html';
  });
</script>

</body>
</html>
