<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>휙떠나 - 지역 선택</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f4f7fc; color:#333;">

<!-- 헤더 -->
<header style="background:#fff; padding:16px 32px; display:flex; justify-content:space-between; align-items:center;">
  <h1 style="font-size:1.8rem; font-weight:bold; margin:0; display:flex; align-items:center;">
    <span style="background:linear-gradient(90deg, #4e54c8, #ec407a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">휙떠나</span>
    <small style="font-size:0.75rem; background:#d1e8ff; color:#2196f3; padding:2px 6px; border-radius:4px; margin-left:8px;">베타</small>
  </h1>
  <a id="btnHome" href="main-home.html" style="text-decoration:none; color:#333; font-weight:bold;">메인으로</a>
</header>

<!-- 진행바 -->
<div style="height:4px; background:#e0e0e0;">
  <div class="progress" style="width:50%; height:100%; background:#2196f3; transition:width 0.3s;"></div>
</div>

<!-- 메인 컨텐츠 -->
<main class="container">
  <form class="region-form">

    <!-- 네비게이션 -->
    <div class="form-nav">
      <button type="button" class="btn btn-back">← 이전</button>
    </div>

    <!-- 제목 -->
    <h2 class="form-title">여행하고 싶은 지역을 선택하세요</h2>

    <!-- 지역 선택 그리드 -->
    <fieldset class="selection-grid">
      <legend class="visually-hidden">여행 지역 선택</legend>

      <label class="selection-option">
        <input type="radio" name="region" value="gapyeong-yangpyeong">
        <img src="icons/icon_00.png" alt="가평·양평 아이콘">
        <span>가평·양평</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="gangneung-sokcho">
        <img src="icons/icon_01.png" alt="강릉·속초 아이콘">
        <span>강릉·속초</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="gyeongju">
        <img src="icons/icon_02.png" alt="경주 아이콘">
        <span>경주</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="busan">
        <img src="icons/icon_03.png" alt="부산 아이콘">
        <span>부산</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="yeosu">
        <img src="icons/icon_04.png" alt="여수 아이콘">
        <span>여수</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="incheon">
        <img src="icons/icon_05.png" alt="인천 아이콘">
        <span>인천</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="jeju">
        <img src="icons/icon_07.png" alt="제주 아이콘">
        <span>제주</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="chuncheon-hongcheon">
        <img src="icons/icon_08.png" alt="춘천·홍천 아이콘">
        <span>춘천·홍천</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="taean">
        <img src="icons/icon_09.png" alt="태안 아이콘">
        <span>태안</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="tongyeong-geoje-namhae">
        <img src="icons/icon_10.png" alt="통영·거제·남해 아이콘">
        <span>통영·거제·남해</span>
      </label>
      <label class="selection-option">
        <input type="radio" name="region" value="pohang-andong">
        <img src="icons/icon_11.png" alt="포항·안동 아이콘">
        <span>포항·안동</span>
      </label>
    </fieldset>

    <!-- 선택 정보 -->
    <div class="info-box">
      <p>여행 일수: <strong id="days-info">-</strong></p>
      <p>선택한 지역: <strong id="selected-region">선택해주세요</strong></p>
    </div>

    <!-- 추천 버튼 -->
    <button type="submit" class="btn btn-primary btn-next">추천 받기</button>
  </form>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const daysInfoEl = document.getElementById('days-info');
    const selectedEl = document.getElementById('selected-region');
    const regionForm = document.querySelector('.region-form');

    // 여행 일수 표시
    const days = localStorage.getItem('selectedDays');
    daysInfoEl.textContent = days ? `${days}일` : '-';

    // 강조 스타일 적용
    document.querySelectorAll('input[name="region"]').forEach(radio => {
      radio.addEventListener('change', function () {
        // 모든 버튼 스타일 초기화
        document.querySelectorAll('.selection-option').forEach(label => {
          label.style.border = '1px solid #ccc';
          label.style.background = 'white';
          label.style.color = 'inherit';
          label.style.fontWeight = 'normal';
          label.style.borderRadius = '8px';
        });

        // 선택한 버튼 강조
        const label = this.closest('label');
        label.style.background = '#5e4fdb';
        label.style.color = 'white';
        label.style.fontWeight = 'bold';
        label.style.border = 'none';
        label.style.borderRadius = '12px';

        selectedEl.textContent = label.querySelector('span').textContent;
      });
    });

    // 제출 → 지역 저장 및 이동
    regionForm.addEventListener('submit', e => {
      e.preventDefault();
      let checked = regionForm.querySelector('input[name="region"]:checked');

      if (!checked) {
        alert('랜덤한 곳으로 추천됩니다!');
        const all = Array.from(regionForm.querySelectorAll('input[name="region"]'));
        checked = all[Math.floor(Math.random() * all.length)];
      }

      localStorage.setItem('selectedRegion', checked.value);
      localStorage.setItem('selectedRegionName',
        checked.closest('label').querySelector('span').textContent
      );

      location.href = 'subregion.html';
    });

    // 이전 버튼 동작
    document.querySelector('.btn-back').addEventListener('click', () => history.back());
  });
</script>

</body>
</html>
