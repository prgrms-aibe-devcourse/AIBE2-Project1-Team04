<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여행지 선택</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단 진행바 -->
  <header class="header">
    <h1 class="logo">휙떠나 <span class="beta">베타</span></h1>
    <div class="progress-bar">
      <div class="progress" style="width: 50%;"></div>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="container">
    <form class="region-form">
      <!-- 네비게이션 -->
      <div class="form-nav">
        <a href="#" class="btn-back">← 이전</a>
        <span></span>  <!-- 중앙 여백용 -->
        <a href="#" class="btn-home">메인으로</a>
      </div>

      <!-- 제목 -->
      <h2 class="form-title">여행하고 싶은 지역을 선택하세요</h2>

      <!-- 지역 선택 그리드 -->
      <fieldset class="region-grid">
        <legend class="visually-hidden">여행 지역 선택</legend>

        <label>
          <input type="radio" name="region" value="gapyeong-yangpyeong">
          <img src="icons/icon_00.png" alt="가평·양평 아이콘">
          <span>가평·양평</span>
        </label>

        <label>
          <input type="radio" name="region" value="gangneung-sokcho">
          <img src="icons/icon_01.png" alt="강릉·속초 아이콘">
          <span>강릉·속초</span>
        </label>

        <label>
          <input type="radio" name="region" value="gyeongju">
          <img src="icons/icon_02.png" alt="경주 아이콘">
          <span>경주</span>
        </label>

        <label>
          <input type="radio" name="region" value="busan">
          <img src="icons/icon_03.png" alt="부산 아이콘">
          <span>부산</span>
        </label>

        <label>
          <input type="radio" name="region" value="yeosu">
          <img src="icons/icon_04.png" alt="여수 아이콘">
          <span>여수</span>
        </label>

        <label>
          <input type="radio" name="region" value="incheon">
          <img src="icons/icon_05.png" alt="인천 아이콘">
          <span>인천</span>
        </label>

        <label>
          <input type="radio" name="region" value="jeonju">
          <img src="icons/icon_06.png" alt="전주 아이콘">
          <span>전주</span>
        </label>

        <label>
          <input type="radio" name="region" value="jeju">
          <img src="icons/icon_07.png" alt="제주 아이콘">
          <span>제주</span>
        </label>

        <label>
          <input type="radio" name="region" value="chuncheon-hongcheon">
          <img src="icons/icon_08.png" alt="춘천·홍천 아이콘">
          <span>춘천·홍천</span>
        </label>

        <label>
          <input type="radio" name="region" value="taean">
          <img src="icons/icon_09.png" alt="태안 아이콘">
          <span>태안</span>
        </label>

        <label>
          <input type="radio" name="region" value="tongyeong-geoje-namhae">
          <img src="icons/icon_10.png" alt="통영·거제·남해 아이콘">
          <span>통영·거제·남해</span>
        </label>

        <label>
          <input type="radio" name="region" value="pohang-andong">
          <img src="icons/icon_11.png" alt="포항·안동 아이콘">
          <span>포항·안동</span>
        </label>

      </fieldset>

      <!-- 선택 정보 -->
      <div class="selection-info">
        <p>여행 일수: <strong>3일</strong></p>
        <p>선택한 지역: <strong id="selected-region">선택해주세요</strong></p>
      </div>

      <!-- 제출 버튼 -->
      <button type="submit" class="btn-submit">추천 받기</button>
    </form>
  </main>

  <script>
    // 선택된 지역명을 표시할 요소
    const selectedEl = document.getElementById('selected-region');

    // 모든 region 라디오 버튼에 change 이벤트 등록
    document.querySelectorAll('input[name="region"]').forEach(radio => {
      radio.addEventListener('change', e => {
        const regionName = e.target.closest('label').querySelector('span').textContent;
        selectedEl.textContent = regionName;
      });
    });

    // 이전 페이지로 돌아가기
    document.querySelector('.btn-back').addEventListener('click', e => {
      e.preventDefault();
      window.history.back();
    });
  </script>
</body>
</html>
