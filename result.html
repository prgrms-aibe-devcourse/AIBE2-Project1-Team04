<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휙떠나 - 맞춤 여행 추천</title>
  <link rel="stylesheet" href="style/style.css">
  <script src="config/apiKey.js"></script>
  <!-- html2canvas 라이브러리 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
  <script>
    const API_KEY = 'YOUR_API_KEY_HERE';
    const KAKAO_API_KEY = "kakao_api_key_here"; // 카카오톡 API 키

    function generatePrompt(travelType, travelDays, category, subcategories) {
      return `
${travelDays}박 ${travelDays + 1}일 동안 ${travelType === 'food' ? '식도락 여행' : '지역 여행'}을 계획하고 싶어.
  선택한 대분류는 ${category}이고, 세부 항목은 ${subcategories.join(', ')}야.
  Day 1 부터 Day ${travelDays + 1}까지 날짜별로 오전, 오후, 저녁 일정을 추천해줘.
  예시 형식:
  Day 1
  - 오전
  - 방문 장소 : 
  - 추천 음식 : 
  - 오후
  - 방문 장소 :
  - 추천 음식 :
  - 저녁
  - 방문 장소 :
  - 추천 음식 :

  위와 같은 형식으로 답변해줘. 다른 말은 하지 말고 일정만 깔끔하게 보여줘. 마지막으로 식도락 여행이면 날마다 선택된 음식의 비슷한 요리는 하나씩 포함시켜줘`;
    }

    async function fetchRecommendation(prompt) {
      // 로딩 상태 표시
      const resultDiv = document.getElementById('recommendation-result');
      resultDiv.innerHTML = "<div class='loading'>여행 일정을 준비하고 있습니다...</div>";
      
      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.7
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(`Error ${response.status}: ${errorData.error.message}`);
        }

        const data = await response.json();
        return data.choices[0].message.content.trim();
      } catch (err) {
        console.error(err);
        throw err;
      }
    }

    function renderCards(recommendation) {
      const resultDiv = document.getElementById('recommendation-result');
      resultDiv.innerHTML = "";

      const matches = recommendation.match(/Day ?\d+([\s\S]*?)(?=Day ?\d+|$)/gi);

      if (!matches) {
        resultDiv.innerText = "결과를 나누지 못했습니다.";
        return;
      }

      matches.forEach((dayText, index) => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
          <h3>Day ${index + 1}</h3>
          <p>${dayText.replace(/Day ?\d+/, '').trim().replace(/\n/g, '<br>')}</p>
        `;
        resultDiv.appendChild(card);
      });
    }

    // 새로운 추천 요청 함수
    async function regenerateRecommendation() {
      const travelType = localStorage.getItem('recommendType') || 'random';
      const travelDays = parseInt(localStorage.getItem('selectedDays')) || 1;

      let category = '-';
      let subcategories = [];

      if (travelType === 'food') {
        const stored = JSON.parse(localStorage.getItem('selectedFoods'));
        const subStored = JSON.parse(localStorage.getItem('selectedSubFoods'));
        category = stored && stored.length > 0 ? stored[0] : '식도락';
        subcategories = subStored || [];
      } else if (travelType === 'area') {
        const regionMap = {
          "gapyeong-yangpyeong": "가평·양평",
          "gangneung-sokcho": "강릉·속초",
          "gyeongju": "경주",
          "busan": "부산",
          "yeosu": "여수",
          "incheon": "인천",
          "jeonju": "전주",
          "jeju": "제주",
          "chuncheon-hongcheon": "춘천·홍천",
          "taean": "태안",
          "tongyeong-geoje-namhae": "통영·거제·남해",
          "pohang-andong": "포항·안동"
        };
        const selectedRegion = localStorage.getItem('selectedRegion');
        category = regionMap[selectedRegion] || '선택 지역';
        subcategories = [category];
      } else {
        category = '랜덤';
        subcategories = ['무작위 추천'];
      }

      const prompt = generatePrompt(travelType, travelDays, category, subcategories);
      
      try {
        // 재생성 버튼 비활성화
        document.getElementById('btnRegenerate').disabled = true;
        document.getElementById('btnRegenerate').innerText = '추천 중...';
        
        const recommendation = await fetchRecommendation(prompt);
        renderCards(recommendation);
      } catch (err) {
        document.getElementById('recommendation-result').innerHTML = 
          '<div class="error-message">추천을 가져오는데 실패했습니다. 다시 시도해주세요.</div>';
      } finally {
        // 재생성 버튼 다시 활성화
        document.getElementById('btnRegenerate').disabled = false;
        document.getElementById('btnRegenerate').innerText = '일정 다시 만들기';
      }
    }

    // 현재 화면을 이미지로 저장하는 함수
    function saveAsImage() {
      // 저장 중임을 표시
      const saveBtn = document.getElementById('btnSave');
      const originalText = saveBtn.innerText;
      saveBtn.disabled = true;
      saveBtn.innerText = '저장 중...';
      
      // 저장할 컨테이너 요소 지정
      const container = document.querySelector('.container');
      
      html2canvas(container).then(canvas => {
        // 캔버스를 이미지 URL로 변환
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        
        // 다운로드 링크 생성
        const link = document.createElement('a');
        link.href = imgData;
        link.download = '휙떠나_여행일정_' + new Date().toISOString().slice(0, 10) + '.jpg';
        link.click();
        
        // 버튼 상태 복원
        saveBtn.disabled = false;
        saveBtn.innerText = originalText;
      }).catch(err => {
        console.error('이미지 저장 중 오류 발생:', err);
        saveBtn.disabled = false;
        saveBtn.innerText = originalText;
        alert('이미지 저장에 실패했습니다. 다시 시도해주세요.');
      });
    }

    // 카카오톡으로 공유하기 함수
    function shareToKakao() {
      let textToShare = '';
      document.querySelectorAll('.day-card').forEach(card => {
        const title = card.querySelector('h3').innerText;
        // p 태그의 innerHTML을 텍스트로 변환하여 <br>을 줄바꿈으로 대체
        const content = card.querySelector('p')?.innerHTML.replace(/<br>/g, '\n') || '';
        textToShare += `${title}\n${content}\n\n`;
      });

      Kakao.Link.sendDefault({
        objectType: 'text',
        text: textToShare.trim(),
        link: {
          mobileWebUrl: location.href,
          webUrl: location.href
        },
        buttonTitle: '여행 일정 보러가기'
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      // 카카오 SDK 초기화
      Kakao.init(KAKAO_API_KEY);

      const travelType = localStorage.getItem('recommendType') || 'random';
      const travelDays = parseInt(localStorage.getItem('selectedDays')) || 1;

      let category = '-';
      let subcategories = [];

      if (travelType === 'food') {
        const stored = JSON.parse(localStorage.getItem('selectedFoods'));
        const subStored = JSON.parse(localStorage.getItem('selectedSubFoods'));
        category = stored && stored.length > 0 ? stored[0] : '식도락';
        subcategories = subStored || [];
      } else if (travelType === 'area') {
        const regionMap = {
          "gapyeong-yangpyeong": "가평·양평",
          "gangneung-sokcho": "강릉·속초",
          "gyeongju": "경주",
          "busan": "부산",
          "yeosu": "여수",
          "incheon": "인천",
          "jeonju": "전주",
          "jeju": "제주",
          "chuncheon-hongcheon": "춘천·홍천",
          "taean": "태안",
          "tongyeong-geoje-namhae": "통영·거제·남해",
          "pohang-andong": "포항·안동"
        };
        const selectedRegion = localStorage.getItem('selectedRegion');
        category = regionMap[selectedRegion] || '선택 지역';
        subcategories = [category];
      } else {
        category = '랜덤';
        subcategories = ['무작위 추천'];
      }

      document.getElementById('summary-text').innerHTML = `
        <div>${category} 여행</div>
        <small>선택한 항목: ${subcategories.join(', ')}</small>
      `;

      const prompt = generatePrompt(travelType, travelDays, category, subcategories);
      fetchRecommendation(prompt)
        .then(recommendation => renderCards(recommendation))
        .catch(err => {
          console.error(err);
          document.getElementById('recommendation-result').innerHTML = 
            '<div class="error-message">추천을 가져오는데 실패했습니다. 다시 시도해주세요.</div>';
        });
      
      // 버튼에 이벤트 리스너 연결
      document.getElementById('btnRegenerate').addEventListener('click', regenerateRecommendation);
      document.getElementById('btnSave').addEventListener('click', saveAsImage);
      document.getElementById('btnShare').addEventListener('click', shareItinerary);
    });
  </script>
  <style>

      font-family: 'Pretendard', sans-serif;

    }

    .top-bar {
      background: white;
      padding: 16px 32px;
      display: flex;

    }

    .progress-bar-container {

    .progress-bar {

    .container {

    .tip-box {

    .buttons button {

    .buttons button:hover {

  </style>

<body>
<!-- 헤더 -->
<header style="background:#fff; padding:16px 32px; display:flex; justify-content:space-between; align-items:center;">

<div class="container">

  <div class="subtitle" id="summary-text"></div>

    <p>🌟 관광지는 하루 목표치의 환경이나 날씨 상황에 맞춰 조정하세요.<br>
    🌟 날씨가 좋은 날에 야외 방문을 추천합니다.<br>

  </div>
</div>

<div class="buttons">
  <button id="btnShare">공유하기</button>

</div>
